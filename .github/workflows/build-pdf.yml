name: Build PDF

on:
  workflow_dispatch:
    inputs:
      markdown_file:
        description: Markdown file to convert
        default: RESUME.md
      output_name:
        description: Output PDF name (optional, default is <name>-<yyyy-MM-dd>.pdf)
        required: false
  push:
    paths:
      - "**.md"
      - "export.py"
      - "styles.css"
      - "requirements.txt"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MD_FILE: ${{ inputs.markdown_file || 'RESUME.md' }}
      OUTPUT_NAME: ${{ inputs.output_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export PDF
        run: |
          if [ -n "$OUTPUT_NAME" ]; then
            pdf="$OUTPUT_NAME"
          else
            pdf="${MD_FILE%.md}-$(date +%Y-%m-%dT%H.%M.%SZ).pdf"
          fi
          python export.py "$MD_FILE" --output "$pdf"
          echo "PDF_FILE=$pdf" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: ${{ env.PDF_FILE }}
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="pdf-$(date +%F)-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "$PDF_FILE" \
            --target "$GITHUB_SHA" \
            --title "$(basename "$PDF_FILE")" \
            --notes "Generated from \`$MD_FILE\` at ${GITHUB_SHA::7}."